name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update info.json
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          DATE=$(date -u '+%Y-%m-%d %H:%M:%S')
          python3 -c "
          import json, sys
          with open('aardbei-updates/info.json', 'r') as f:
              data = json.load(f)
          data['version'] = '$VERSION'
          data['last_updated'] = '$DATE'
          with open('aardbei-updates/info.json', 'w') as f:
              json.dump(data, f, indent=4, ensure_ascii=False)
          print('info.json updated to v$VERSION')
          "

      - name: Commit updated info.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aardbei-updates/info.json
          git diff --cached --quiet || git commit -m "chore: bump info.json to v${{ steps.tag.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Build plugin ZIP
        run: |
          cd "$GITHUB_WORKSPACE/.."
          zip -r aardbei-reserveringen.zip aardbei-reserveringen \
            --exclude "aardbei-reserveringen/.git/*" \
            --exclude "aardbei-reserveringen/.github/*" \
            --exclude "aardbei-reserveringen/.DS_Store" \
            --exclude "aardbei-reserveringen/*.log"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Aardbei Reserveringen ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: ${{ github.workspace }}/../aardbei-reserveringen.zip
